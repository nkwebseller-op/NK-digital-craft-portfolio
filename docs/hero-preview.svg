  <text x="1210" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="500" text-anchor="middle">UI / UX</text>

  <!-- Scroll indicator -->
  <rect x="715" y="756" width="22" height="36" rx="11" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="726" cy="768" r="3" fill="#0EA5E9">
    <animate attributeName="cy" values="766;776;766" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
