<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1633;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0D1E47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:0.4" />
    </linearGradient>
    <!-- Glow effect for accent -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle particle dots pattern -->
    <radialGradient id="particleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0"/>
    </radialGradient>
    <!-- Explosion bg radial -->
    <radialGradient id="explosionGrad" cx="70%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0A1633;stop-opacity:0"/>
    </radialGradient>
    <!-- Circles overlay -->
    <radialGradient id="circlesGrad" cx="80%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#0A1633;stop-opacity:0"/>
    </radialGradient>
    <!-- Nav shadow -->
    <filter id="navShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="810" fill="url(#bgGrad)"/>
  <!-- Explosion radial overlay -->
  <ellipse cx="1010" cy="405" rx="600" ry="420" fill="url(#explosionGrad)"/>
  <!-- Circles overlay -->
  <ellipse cx="1150" cy="380" rx="340" ry="340" fill="url(#circlesGrad)"/>

  <!-- Scattered particles -->
  <circle cx="120" cy="180" r="1.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="280" cy="90" r="1" fill="#38BDF8" opacity="0.4"/>
  <circle cx="400" cy="250" r="1.5" fill="#93C5FD" opacity="0.35"/>
  <circle cx="60" cy="400" r="1" fill="#38BDF8" opacity="0.45"/>
  <circle cx="180" cy="550" r="2" fill="#38BDF8" opacity="0.3"/>
  <circle cx="320" cy="680" r="1.5" fill="#93C5FD" opacity="0.4"/>
  <circle cx="700" cy="100" r="1" fill="#38BDF8" opacity="0.35"/>
  <circle cx="850" cy="60" r="1.5" fill="#38BDF8" opacity="0.4"/>
  <circle cx="1050" cy="130" r="1" fill="#93C5FD" opacity="0.3"/>
  <circle cx="1200" cy="200" r="2" fill="#38BDF8" opacity="0.5"/>
  <circle cx="1350" cy="80" r="1.5" fill="#38BDF8" opacity="0.4"/>
  <circle cx="1400" cy="300" r="1" fill="#93C5FD" opacity="0.35"/>
  <circle cx="1300" cy="500" r="2" fill="#38BDF8" opacity="0.45"/>
  <circle cx="950" cy="700" r="1.5" fill="#38BDF8" opacity="0.3"/>
  <circle cx="480" cy="760" r="1" fill="#93C5FD" opacity="0.4"/>
  <circle cx="600" cy="640" r="1.5" fill="#38BDF8" opacity="0.35"/>
  <circle cx="750" cy="720" r="1" fill="#38BDF8" opacity="0.3"/>
  <!-- Particle connection lines -->
  <line x1="120" y1="180" x2="280" y2="90" stroke="#38BDF8" stroke-width="0.5" opacity="0.15"/>
  <line x1="280" y1="90" x2="400" y2="250" stroke="#38BDF8" stroke-width="0.5" opacity="0.12"/>
  <line x1="1200" y1="200" x2="1350" y2="80" stroke="#38BDF8" stroke-width="0.5" opacity="0.15"/>
  <line x1="1050" y1="130" x2="1200" y2="200" stroke="#93C5FD" stroke-width="0.5" opacity="0.12"/>

  <!-- ============ NAVBAR ============ -->
