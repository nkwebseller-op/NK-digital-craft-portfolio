  <!-- Logo -->
  <text x="60" y="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="white" letter-spacing="0.5">NK Digital Craft</text>
  <rect x="227" y="38" width="6" height="6" fill="#0EA5E9"/>

  <!-- Nav links -->
  <text x="650" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Home</text>
  <text x="710" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">About</text>
  <text x="768" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Services</text>
  <text x="838" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Work</text>
  <text x="886" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Contact</text>

  <!-- Hire Me button -->
  <rect x="1320" y="22" width="100" height="36" rx="4" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="1370" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#0EA5E9" text-anchor="middle" font-weight="600">Hire Me</text>

  <!-- Social icons (dots representing icons) -->
  <circle cx="1220" cy="40" r="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="1248" cy="40" r="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="1276" cy="40" r="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
