  <rect x="60" y="145" width="220" height="30" rx="15" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <circle cx="80" cy="160" r="4" fill="#0EA5E9"/>
  <text x="94" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0EA5E9" font-weight="500" letter-spacing="1">AI WEBSITE CREATOR</text>

  <!-- Main heading line 1 -->
  <text x="60" y="238" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" fill="white" letter-spacing="-1">AI-Powered Websites</text>
  <!-- Main heading line 2 accent -->
  <text x="60" y="308" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" fill="#0EA5E9" letter-spacing="-1" filter="url(#glow)">Into Digital Growth</text>
  <!-- Dot accent -->
  <circle cx="64" cy="340" r="5" fill="#0EA5E9"/>

  <!-- Subtext -->
  <text x="60" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.55)" font-weight="300">I&apos;m Nikhil Kumar Singh — Founder &amp; CEO of NK Digital Craft.</text>
  <text x="60" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.55)" font-weight="300">AI Websites · Full Stack · SEO · Digital Marketing · Automation</text>
  <text x="60" y="432" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.45)" font-weight="300">Serving businesses from Puri, Odisha · 10+ years experience</text>

  <!-- CTA Buttons -->
  <rect x="60" y="465" width="170" height="50" rx="6" fill="#0EA5E9"/>
  <text x="145" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">View My Work</text>

  <rect x="248" y="465" width="170" height="50" rx="6" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <text x="333" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="500">Contact Me</text>

  <!-- Stat counters row -->
  <text x="60" y="575" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="38" fill="#0EA5E9">10</text>
  <text x="60" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">YEARS EXPERIENCE</text>
  <line x1="130" y1="558" x2="130" y2="610" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="148" y="575" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="38" fill="#0EA5E9">25</text>
  <text x="148" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">SERVICES OFFERED</text>
  <line x1="240" y1="558" x2="240" y2="610" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="258" y="575" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="38" fill="#0EA5E9">1</text>
  <text x="258" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">LIVE CLIENT PROJECT</text>

  <!-- Page indicator dots (bottom left) -->
  <circle cx="60" cy="760" r="5" fill="#0EA5E9"/>
  <circle cx="78" cy="760" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="92" cy="760" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="106" cy="760" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="120" cy="760" r="3" fill="rgba(255,255,255,0.25)"/>

  <!-- ============ RIGHT SIDE — Avatar area ============ -->
  <!-- Circular glow behind avatar -->
  <circle cx="1040" cy="490" r="280" fill="rgba(14,165,233,0.04)" stroke="rgba(14,165,233,0.07)" stroke-width="1"/>
  <circle cx="1040" cy="490" r="230" fill="rgba(30,58,138,0.18)" stroke="rgba(14,165,233,0.1)" stroke-width="1"/>
  <!-- Rotating circle star decoration suggestion -->
  <circle cx="1040" cy="490" r="290" fill="none" stroke="rgba(14,165,233,0.06)" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Avatar figure (silhouette style) -->
  <!-- Body/torso area -->
  <ellipse cx="1040" cy="680" rx="130" ry="60" fill="#0A1633" opacity="0.6"/>
  <!-- Shirt/body -->
  <path d="M930 760 Q940 580 1040 560 Q1140 580 1150 760 Z" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.2)" stroke-width="1"/>
  <!-- Head circle -->
  <circle cx="1040" cy="460" r="110" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.15)" stroke-width="1.5"/>
  <!-- Face placeholder oval -->
  <ellipse cx="1040" cy="455" rx="72" ry="88" fill="rgba(30,58,138,0.3)"/>
  <!-- Subtle highlight on avatar circle -->
  <circle cx="1040" cy="460" r="108" fill="none" stroke="rgba(14,165,233,0.22)" stroke-width="2"/>

  <!-- NK initials watermark on avatar -->
  <text x="1040" y="475" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="52" fill="rgba(14,165,233,0.18)" text-anchor="middle" letter-spacing="4">NK</text>

  <!-- Floating skill badges around avatar -->
  <!-- AI badge -->
  <rect x="780" y="310" width="110" height="38" rx="19" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.35)" stroke-width="1.5"/>
  <circle cx="802" cy="329" r="7" fill="#0EA5E9" opacity="0.8"/>
  <text x="816" y="334" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" font-weight="600">AI Websites</text>

  <!-- Full Stack badge -->
  <rect x="1160" y="330" width="120" height="38" rx="19" fill="rgba(30,58,138,0.5)" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
  <text x="1220" y="354" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" font-weight="500" text-anchor="middle">Full Stack</text>

  <!-- SEO badge -->
  <rect x="790" y="630" width="90" height="36" rx="18" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
  <text x="835" y="653" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#0EA5E9" font-weight="600" text-anchor="middle">SEO</text>

