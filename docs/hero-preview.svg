  <!-- Bottom gradient fade -->
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1633;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0A1633;stop-opacity:0.6"/>
